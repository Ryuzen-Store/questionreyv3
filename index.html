  <!-- Icon sprite is fetched and injected inline by js/components/icons.js so
       <use href="#i-..."> references resolve in the same document. -->
  <link rel="preload" as="fetch" href="./assets/icons/questionry-icons.svg" fetchpriority="low">
</head>
<body>
  <div id="app">
    <!-- Header (sticky): brand / server status / nav — injected by components/header.js -->
    <header id="app-header"></header>

    <main id="app-main" class="app-main" tabindex="-1">
      <!-- Views are rendered here by the router -->
      <section id="view" class="view" aria-live="polite"></section>
    </main>

    <!-- Bottom navigation host (rendered by components/navigation.js) -->
    <div id="app-nav" class="app-nav"></div>

    <footer id="app-footer" class="app-footer"></footer>
  </div>

  <!-- Modal, toast and loading hosts -->
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="assertive"></div>
  <div id="loading-root"></div>
  <div id="overlay-root" class="overlay-root"></div>

  <!-- ============ APP BOOT ============ -->
  <!-- Supabase is loaded as a classic UMD script so window.supabase is available
       to the existing modular application. If the CDN is unavailable, the app
       still boots in local/offline mode instead of freezing on a blank screen. -->
  <script>
    (function () {
      var appStarted = false;
      var timeoutId;
      function startApp() {
        if (appStarted) return;
        appStarted = true;
        clearTimeout(timeoutId);
        var script = document.createElement('script');
        script.type = 'module';
        script.src = '/js/app.js';
        script.onerror = function () {
          var box = document.getElementById('boot-error');
          if (box) {
            box.hidden = false;
            box.querySelector('[data-error]').textContent =
              'JavaScript aplikasi gagal dimuat. Periksa path file dan deploy ulang.';
          }
        };
        document.body.appendChild(script);
      }

      function loadSupabase() {
        if (window.supabase && typeof window.supabase.createClient === 'function') {
          startApp();
          return;
        }
        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
        s.crossOrigin = 'anonymous';
        s.onload = startApp;
        s.onerror = startApp;
        document.head.appendChild(s);
        // Never block the application indefinitely on a third-party CDN.
        timeoutId = setTimeout(startApp, 5000);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadSupabase, { once: true });
      } else {
        loadSupabase();
      }
    })();
  </script>
  <div id="boot-error" hidden style="font-family:system-ui,sans-serif;max-width:480px;margin:24px auto;padding:20px;border:4px solid #111;box-shadow:8px 8px 0 #111;background:#fff">
    <strong>QuestionRy gagal dimuat</strong>
    <p data-error>Terjadi kesalahan saat memulai aplikasi.</p>
    <button type="button" onclick="location.reload()">MUAT ULANG</button>
  </div>
  <noscript>
    <div style="font-family:sans-serif;max-width:640px;margin:80px auto;padding:24px;border:3px solid #12110F;box-shadow:8px 8px 0 #12110F;background:#fff">
      <h1>QuestionRy Multi Quest</h1>
      <p>Aplikasi ini membutuhkan JavaScript. Aktifkan JavaScript di browser Anda untuk bermain kuis.</p>
    </div>
  </noscript>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js", { scope: "/" })
          .then(() => console.log("QuestionRy PWA siap"))
          .catch((err) => console.warn("PWA gagal didaftarkan", err));
      });
    }
  </script>

</body>
</html>
